name: Morning briefing

on:
  schedule:
    # 01:20 UTC = 06:50 IST. GitHub often starts cron runs 5-15 min late, so this lands ~07:00.
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if already sent today / skipped"
        type: boolean
        default: true

# One writer of data/state.db at a time (shared with poll.yml).
concurrency:
  group: bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send briefing
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
          WAIT: ${{ github.event_name == 'schedule' && '--wait' || '' }}
        run: |
          rc=0
          python main.py run $WAIT $FORCE || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Commit state
        if: always()
        run: ./scripts/commit_state.sh

      # Exit code 2 = Python already alerted you on Telegram. Anything else (pip failure,
      # crash before the alert could be sent) gets this fallback alert.
      - name: Fallback failure alert
        if: failure() && steps.run.outputs.rc != '2'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 Briefing bot run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > /dev/null || true
