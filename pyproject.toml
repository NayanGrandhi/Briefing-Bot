[project]
name = "briefing-bot"
version = "1.0.0"
description = "A free, modular daily briefing bot for Telegram that runs on GitHub Actions."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"core/demo.py" = ["E501"]
"tests/*" = ["E501"]
